<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Chat</title>
  <style>
    :root { color-scheme: dark; --bg: #111318; --panel: #191c24; --border: #2d3340; --muted: #9aa3b2; --accent: #8b9cff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: #eef1f7; font: 15px/1.5 system-ui, sans-serif; }
    .app { display: grid; grid-template-rows: auto 1fr auto; max-width: 900px; min-height: 100vh; margin: auto; padding: 20px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 20px; }
    h1 { margin: 0; font-size: 20px; }
    .subtitle { color: var(--muted); font-size: 13px; }
    select, textarea, button { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: inherit; font: inherit; }
    select { padding: 9px 12px; }
    main { overflow: auto; padding: 12px 0 28px; }
    .empty { display: grid; place-items: center; height: 60vh; color: var(--muted); text-align: center; }
    .message { display: flex; gap: 12px; margin: 18px 0; }
    .message .label { flex: 0 0 64px; color: var(--muted); font-size: 12px; padding-top: 3px; text-transform: uppercase; }
    .message .content { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 760px; }
    .message.user .content { color: #dce2ff; }
    form { display: flex; gap: 10px; align-items: end; }
    textarea { flex: 1; min-height: 48px; max-height: 180px; resize: vertical; padding: 12px; outline: none; }
    textarea:focus, select:focus { border-color: var(--accent); }
    button { padding: 11px 18px; cursor: pointer; background: var(--accent); border-color: var(--accent); color: #101321; font-weight: 650; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .status { min-height: 22px; padding: 8px 0; color: var(--muted); font-size: 13px; }
    .error { color: #ff9e9e; }
    @media (max-width: 600px) { .app { padding: 14px; } header { align-items: flex-start; flex-direction: column; } select { width: 100%; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>API Chat</h1>
        <div class="subtitle">One simple chat for your own AI provider keys</div>
      </div>
      <select id="provider" aria-label="AI provider"></select>
    </header>
    <main id="messages"><div class="empty">Choose a configured provider and start a conversation.</div></main>
    <section>
      <div id="status" class="status" aria-live="polite"></div>
      <form id="chat-form">
        <textarea id="prompt" placeholder="Message the model…" rows="1" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </div>
  <script>
    const providerSelect = document.querySelector('#provider');
    const messagesElement = document.querySelector('#messages');
    const statusElement = document.querySelector('#status');
    const promptElement = document.querySelector('#prompt');
    const sendButton = document.querySelector('#send');
    const messages = [];
    let providers = [];

    function render() {
      messagesElement.replaceChildren();
      if (!messages.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Start a conversation.';
        messagesElement.append(empty);
        return;
      }
      for (const message of messages) {
        const row = document.createElement('div');
        row.className = `message ${message.role}`;
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = message.role === 'user' ? 'You' : 'AI';
        const content = document.createElement('div');
        content.className = 'content';
        content.textContent = message.content;
        row.append(label, content);
        messagesElement.append(row);
      }
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    function setStatus(text, isError = false) {
      statusElement.textContent = text;
      statusElement.className = isError ? 'status error' : 'status';
    }

    async function loadProviders() {
      try {
        providers = await fetch('/api/providers').then(checkResponse).then(response => response.json());
        providerSelect.replaceChildren();
        for (const provider of providers) {
          const option = document.createElement('option');
          option.value = provider.id;
          option.textContent = provider.configured ? `${provider.name} · ${provider.model}` : `${provider.name} · not configured`;
          option.disabled = !provider.configured;
          providerSelect.append(option);
        }
        if (!providers.some(provider => provider.configured)) {
          setStatus('Add an API key to .env, then restart the server.', true);
        }
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function checkResponse(response) {
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.error || `Request failed (${response.status})`);
      }
      return response;
    }

    document.querySelector('#chat-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const content = promptElement.value.trim();
      if (!content || sendButton.disabled) return;
      const provider = providerSelect.value;
      messages.push({ role: 'user', content });
      promptElement.value = '';
      render();
      sendButton.disabled = true;
      setStatus('Thinking…');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider, messages })
        }).then(checkResponse).then(response => response.json());
        messages.push({ role: 'assistant', content: response.content });
        setStatus(`${response.provider} · ${response.model}`);
        render();
      } catch (error) {
        messages.pop();
        render();
        setStatus(error.message, true);
      } finally {
        sendButton.disabled = false;
        promptElement.focus();
      }
    });

    promptElement.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.querySelector('#chat-form').requestSubmit();
      }
    });

    loadProviders();
  </script>
</body>
</html>
